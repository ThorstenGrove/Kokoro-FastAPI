# nginx-Vhost auf ki.home für den deutschen Kokoro-Container (tts01.ask-why.app).
# Ablage: /etc/nginx/sites-available/tts01, Link nach sites-enabled.
# Muster: bestehender Vhost "tts" (Port 8000), aber
#   - lauscht nur auf 127.0.0.1 (frpc verbindet sich lokal),
#   - eigenes Ausgabeverzeichnis /var/www/output-de,
#   - Log ohne Pfad (der Dateiname ist die öffentliche Audio-URL), ohne Query, ohne Body,
#   - error_log warn statt debug.
# Zugriffsbeschränkung auf die API-Server erfolgt am Austrittspunkt (über frp kommt
# hier jede Anfrage von 127.0.0.1, allow/deny wirkt hier nicht).

log_format why_tts_min '[$time_local] "$request_method" $status $body_bytes_sent $request_time';

upstream kokoro_de_backend {
    server 127.0.0.1:8890;
}

server {
    listen 127.0.0.1:8002;
    server_name tts01.ask-why.app;

    access_log /var/log/nginx/tts01/access.log why_tts_min;
    error_log /var/log/nginx/tts01/error.log warn;

    # Nur MP3 aus dem Ausgabeverzeichnis des DE-Containers (Dateinamen: 32 Hex-Zeichen)
    location /output/ {
        alias /var/www/output-de/;
        limit_except GET HEAD { deny all; }

        location ~ ^/output/[0-9a-f]{32}\.mp3$ {
            try_files $uri =404;
            expires 1h;
            add_header Cache-Control "private, max-age=3600";
        }

        return 404;
    }

    # Nur POST /why/tts an den Container
    location = /why/tts {
        limit_except POST { deny all; }
        client_max_body_size 64k;

        proxy_pass http://kokoro_de_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}
