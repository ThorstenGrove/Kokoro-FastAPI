# nginx-Vhost am frp-Austrittspunkt für tts01.ask-why.app (TLS).
#
# Zielbild: nginx auf dem Docker-Host (docker.srv.grove.eco), frps dort mit
#           proxyBindAddr 127.0.0.1 (siehe frps-docker-host.toml).
# Übergang: derselbe Vhost auf dem heutigen Relay 78.46.148.156, falls tts01 vor
#           der Docker-Migration in Betrieb gehen soll (dort lauscht frps nach
#           heutigem Stand vermutlich auf allen Schnittstellen, nicht geprüft).
#
# Ablage z. B. /etc/nginx/sites-available/tts01_ask-why_app, Link nach sites-enabled.
# Zertifikat vorher mit certbot (HTTP-01 über den Port-80-Block unten), DNS muss
# dafür schon auf diesen Server zeigen.
#
# Log: keine Pfade (Dateiname = Zugang zum Audio), keine Query, kein Body,
# IP gekürzt. Der Name des log_format ist eindeutig gewählt, damit er nicht mit
# vorhandenen Formaten des Hosts kollidiert.

map $remote_addr $why_tts01_ip {
    ~(?P<ip4>\d+\.\d+\.\d+)\.\d+   $ip4.0;
    ~(?P<ip6>[^:]+:[^:]+:[^:]+):   $ip6::;
    default                        0.0.0.0;
}

log_format why_tts01_exit '$why_tts01_ip [$time_local] "$request_method" $status $body_bytes_sent $request_time';

upstream frp_tts01 {
    server 127.0.0.1:8002;   # frp-Port des Tunnels "tts01-de"
}

server {
    listen 80;
    listen [::]:80;
    server_name tts01.ask-why.app;

    access_log off;
    error_log /var/log/nginx/error.log warn;

    location /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;   # nginx >= 1.25.1; bei älterem nginx (z. B. 1.22) streichen und "listen 443 ssl http2;" nehmen
    server_name tts01.ask-why.app;

    ssl_certificate /etc/letsencrypt/live/tts01.ask-why.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tts01.ask-why.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/tts01_ask-why_app/access.log why_tts01_exit;
    error_log /var/log/nginx/tts01_ask-why_app/error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Proto $scheme;

    # Synthese: nur die API-Server (das Backend), nicht die App.
    location = /why/tts {
        limit_except POST { deny all; }
        client_max_body_size 64k;

        allow 49.13.119.150;          # appdev.ask-why.app (dev)
        allow 91.99.8.93;             # app.ask-why.app (prod, alte VM)
        # Nach der Docker-Migration: Adresse, mit der die API-Container nach außen
        # gehen (vermutlich die des Docker-Hosts selbst, 159.69.122.50 bzw. IPv6;
        # beim ersten Test im error_log nach "access forbidden" sehen).
        # allow 159.69.122.50;
        # allow 2a01:4f8:c013:e4a5::1;
        deny all;

        proxy_pass http://frp_tts01;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Audiodateien: die App lädt sie direkt (öffentlich, Dateiname als Zugang)
    location ~ ^/output/[0-9a-f]{32}\.mp3$ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://frp_tts01;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}
